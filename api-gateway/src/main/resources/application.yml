spring:
  application:
    name: api-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    web-application-type: reactive
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: "${AUTH_SERVICE_URL:http://localhost:8082}"
          predicates:
            - Path=/auth/**
        - id: slot-service
          uri: "${SLOT_SERVICE_URL:http://localhost:8083}"
          predicates:
            - Path=/doctors/**,/slots/**
        - id: appointment-service
          uri: "${APPOINTMENT_SERVICE_URL:http://localhost:8084}"
          predicates:
            - Path=/appointments/**
        - id: notification-service
          uri: "${NOTIFICATION_SERVICE_URL:http://localhost:8085}"
          predicates:
            - Path=/notifications/**
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowed-origin-patterns: "${FRONTEND_ORIGIN:http://localhost:5173}"
            allowed-methods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowed-headers: "*"
            exposed-headers:
              - X-Correlation-Id
            allow-credentials: true
server:
  port: ${GATEWAY_PORT:8081}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true
info:
  app:
    name: ${spring.application.name}
    version: 0.0.1
app:
  jwt:
    secret: ${JWT_SECRET}
logging:
  level:
    root: INFO
