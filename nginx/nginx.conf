worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # Compress text and application assets while leaving already-compressed media alone.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        text/css
        text/plain
        text/xml;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # The trailing slash removes /api/ before the gateway receives the request.
        location /api/ {
            proxy_pass http://api-gateway:8081/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-Id $http_x_correlation_id;
        }

        # Vite names fingerprinted bundles with a dash followed by a content hash.
        location ~* "-[A-Za-z0-9_-]{8,}\.(css|js|woff2?|ttf|svg|png|jpe?g|webp)$" {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Client-side routes fall back to the React entry point.
        location / {
            try_files $uri /index.html;
        }
    }
}
